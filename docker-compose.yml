services:
  shush-design:
    build: .
    ports:
      - "5036:8080"
    volumes:
      # The database (shush.db), run logs and the keys that encrypt secret variables live here.
      - shush-data:/app/.shush

volumes:
  # External, so `docker compose down -v` can never delete it. Create it once:
  #   docker volume create shush-data
  # Upgrading from the old compose file? Its volume was project-scoped (e.g. ssh-deployment_shush-data):
  # point at it with SHUSH_DATA_VOLUME=ssh-deployment_shush-data (see `docker volume ls`).
  shush-data:
    external: true
    name: ${SHUSH_DATA_VOLUME:-shush-data}
