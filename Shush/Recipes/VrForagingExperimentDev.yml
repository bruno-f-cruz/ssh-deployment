name: VrForagingExperimentDev
params:
  ref:
    type: string
    label: Git Ref
    default: main
vars:
  repoRoot: C:/git
steps:
  - id: clone
    type: GitClone
    with:
      repositoryUrl: https://github.com/AllenNeuralDynamics/Aind.Experiment.VrForaging
      rootPath: ${vars.repoRoot}
      folderName: Aind.Experiment.VrForaging-dev
  - type: GitCheckout
    with:
      path: ${clone.clonedPath}
      reference: ${params.ref}
  - type: RunScript
    with:
      workingDirectory: ${clone.clonedPath}
      commands:
        - "$ErrorActionPreference = 'Stop'"
        - "$ProgressPreference = 'SilentlyContinue'"
        - .\scripts\deploy.ps1
  - type: CreateBatchFile
    with:
      remotePath: C:\Users\Public\Desktop\DEV-VrForagingExperiment.cmd
      lines:
        - cd /d ${clone.clonedPath}
        - uv run clabe run main.py
  - type: WriteFile
    with:
      targetPath: ${clone.clonedPath}/local/clabe.yml
      content: |
        # In order to get picked up, move this file to the root of the project or ./local

        allow_dirty: false
        skip_hardware_validation: false

        # main.py's curriculum-bearing experiments (vr-foraging, vr-foraging-fip) resolve the
        # curriculum package from the VrForaging submodule, not this repo's own root.
        curriculum:
          script: "curriculum run"
          project_directory: "Aind.Behavior.VrForaging/src/packages/aind_behavior_vr_foraging_curricula"

        otel:
          enabled: true
          endpoint: http://127.0.0.1:4318
          software_name: aind-experiment-vr-foraging-fip

        watchdog:
          project_name: "Cognitive flexibility in patch foraging"
          destination: '\\allen\\aind\\stage\\vr-foraging\\data'
          delete_modalities_source_after_success: true
          job_type: "vr_foraging_v2"
          transfer_endpoint: "http://aind-data-transfer-service/api/v2/submit_jobs"
          s3_bucket: "default"
          schedule_time: "18:00:00"

        dataverse:
          tenant_id: "32669cd6-737f-4b39-8bdd-d6951120d3fc"
          client_id: "df37356e-3316-484a-b732-319b6b4ad464"
          org: "org5d93e08d"
