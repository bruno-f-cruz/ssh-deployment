name: VrForagingDev
params:
  tag:
    type: string
    label: Git Tag
    default: v1.2.0rc1
vars:
  repoRoot: C:/git
steps:
  - id: clone
    type: GitClone
    with:
      repositoryUrl: https://github.com/AllenNeuralDynamics/Aind.Behavior.VrForaging
      rootPath: ${vars.repoRoot}
      folderName: Aind.Behavior.VrForaging-dev
  - type: GitCheckout
    with:
      path: ${clone.clonedPath}
      reference: ${params.tag}
      cleanExceptions:
        - .cache_manager.json
  - type: RunScript
    with:
      workingDirectory: ${clone.clonedPath}
      commands:
        - "$ErrorActionPreference = 'Stop'"
        - "$ProgressPreference = 'SilentlyContinue'"
        - .\scripts\deploy.ps1
  - type: CreateBatchFile
    with:
      remotePath: C:\Users\Public\Desktop\DEV-VrForaging.cmd
      lines:
        - cd /d ${clone.clonedPath}
        - uv run clabe run .\scripts\aind.py
  - type: WriteFile
    with:
      targetPath: ${clone.clonedPath}/local/clabe.yml
      content: |
        # In order to get picked up, move this file to the root of the project or ./local

        allow_dirty: false
        skip_hardware_validation: false

        # Stream telemetry (traces + logs) to the local OpenTelemetry Collector, which forwards
        # to the central OpenObserve server. Deploy the OtelCollector recipe on this rig first —
        # it provides the collector on 127.0.0.1:4318, adds the ingest auth, and backfills
        # rig_id/hostname if they're ever missing.
        #   - endpoint uses 127.0.0.1, NOT localhost: on Windows localhost resolves to IPv6 (::1)
        #     first, but the collector's OTLP receiver binds IPv4 (127.0.0.1) — localhost silently
        #     misses and telemetry is dropped.
        #   - software_name identifies the producing app (this is the installed distribution, so
        #     clabe also auto-resolves software_version from it, and tags the Service with it).
        #   - hostname (COMPUTERNAME) and rig_id (aibs_comp_id) auto-resolve on the rig; subject_id
        #     and user_id are filled from the session when it is registered. So only software_name
        #     needs setting here — no auth header and no rig_id.
        otel:
          enabled: true
          endpoint: http://127.0.0.1:4318
          software_name: aind-behavior-vr-foraging

        watchdog:
          project_name: "Cognitive flexibility in patch foraging"
          destination: '\\allen\\aind\\stage\\vr-foraging\\data'
          delete_modalities_source_after_success: true
          job_type: "vr_foraging_v2"
          transfer_endpoint: "http://aind-data-transfer-service/api/v2/submit_jobs"
          s3_bucket: "default"
          schedule_time: 18:00:00

        dataverse:
          tenant_id: "32669cd6-737f-4b39-8bdd-d6951120d3fc"
          client_id: "df37356e-3316-484a-b732-319b6b4ad464"
          org: "org5d93e08d"
