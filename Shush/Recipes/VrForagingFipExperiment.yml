name: VrForagingFipExperiment
params:
  ref:
    type: String
    label: Git Ref
    default: main
  clabeVersion:
    type: String
    label: clabe daemon version (a release, e.g. 0.19.0; "lock" = the release the checkout's uv.lock pins)
    default: lock
    optionsFrom: clabe.versions
  hubs:
    type: String
    label: clabe hubs the daemon enrolls with (';'-separated; "none" to clear)
    default: http://aind-behavior.corp.alleninstitute.org/clabe/
  forceDaemonRestart:
    type: Dropdown
    label: Interrupt a running session to deploy
    default: "false"
    options: ["false", "true"]
  clabeInstaller:
    type: String
    label: clabe installer version (a clabe release tag, e.g. v0.19.0; main = the latest)
    default: main
    optionsFrom: clabe.installers
vars:
  repoRoot: C:/git
  scheduleTime: ${random.time("17:50", "18:10")}
# Deploys Aind.Experiment.VrForaging-Fip (VR Foraging + FIP + Olfactometer) to the behavior rigs, and the clabe daemon
# that serves each rig's runs at one URL and enrolls the rig with the hubs. The daemon finds this checkout under
# C:/git by itself. Runs as the SSH user: that must be the user logged on to the rig (the daemon runs in their session).
steps:
# Stop the daemon before anything changes: deploy.ps1 recreates .venv, and no session may start meanwhile. Refused
# while a session runs, unless forceDaemonRestart; nothing to stop on a new rig. The last step starts it again.
- type: DeployClabeDaemon
  with:
    stopOnly: true
    force: ${params.forceDaemonRestart}
    installer: ${params.clabeInstaller}
- type: RunScript
  with:
    commands:
    - git config --global --unset-all safe.directory 2>$null; if ($LASTEXITCODE -eq 5) { $global:LASTEXITCODE = 0 }
    - git config --global --add safe.directory '*'
- id: clone
  type: GitClone
  with:
    repositoryUrl: https://github.com/AllenNeuralDynamics/Aind.Experiment.VrForaging-Fip
    rootPath: ${vars.repoRoot}
# Also cleans, resets and re-inits the submodules (VrForaging, Fip, Olfactometer).
- type: GitCheckout
  with:
    path: ${clone.clonedPath}
    reference: ${params.ref}
    cleanExceptions:
    - .cache_manager.json
# Sets up the submodules' Bonsai environments in parallel and recreates .venv.
- type: RunScript
  with:
    workingDirectory: ${clone.clonedPath}
    commands:
    - $ErrorActionPreference = 'Stop'
    - $ProgressPreference = 'SilentlyContinue'
    - .\scripts\deploy.ps1
- type: CreateShortcut
  with:
    cmdPath: ${clone.clonedPath}/scripts/launcher.cmd
    shortcutDirectory: C:\Users\Public\Desktop
    shortName: VrForagingFipExperiment
    iconPath: ${clone.clonedPath}/assets/icon.ico
# The experiments' clabe.yml. Behavior and the metadata record upload right away; every other modality (videos,
# FIP...) is appended at the rig's scheduleTime. A literal block (|), so YAML keeps the lines as written.
- type: WriteFile
  with:
    targetPath: ${clone.clonedPath}/local/clabe.yml
    content: |
      curriculum:
        script: ["curriculum", "run"]
        project_directory: "Aind.Behavior.VrForaging"

      otel:
        enabled: true
        endpoint: "http://localhost:4317"
        service_name: "aind-behavior-vr-foraging"
        software_name: "aind-behavior-vr-foraging"

      watchdog:
        project_name: "Cognitive flexibility in patch foraging"
        destination: '\\allen\\aind\\stage\\vr-foraging\\data'
        transfer_endpoint: "http://aind-data-transfer-service/api/v2/submit_jobs"
        s3_bucket: "default"
        upload_groups:
          - name: 1_of_2
            job_type: "vr_foraging_async_0"
            creates_record: true
            modalities: [behavior]
            schedule_time: null
            delete_modalities_source_after_success: true
          - name: 2_of_2
            job_type: "vr_foraging_async_1"
            modalities: "*"
            schedule_time: "${vars.scheduleTime}"
            delete_modalities_source_after_success: true

      dataverse:
        tenant_id: "32669cd6-737f-4b39-8bdd-d6951120d3fc"
        client_id: "df37356e-3316-484a-b732-319b6b4ad464"
        org: "org5d93e08d"
# The daemon runs clabeVersion ("lock": the release this checkout's uv.lock pins), enrolled with the hubs, and starts
# again. Installed next to the clabe it ran before; when it already runs that clabe with these hubs, it only starts.
- type: DeployClabeDaemon
  with:
    version: ${params.clabeVersion}
    lockRepository: ${clone.clonedPath}
    hubs: ${params.hubs}
    force: ${params.forceDaemonRestart}
    installer: ${params.clabeInstaller}
