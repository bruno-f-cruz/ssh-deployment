# Alternate compose file for hosting behind a shared Traefik reverse proxy (see the
# aind-behavior-vm-infra repo) instead of publishing a direct host port. Use this INSTEAD of
# docker-compose.yml, not alongside it:
#
#   docker compose -f docker-compose.proxy.yml up -d --build
#
# Requires the external "proxy" network created by aind-behavior-vm-infra's own compose stack.
services:
  shush-design:
    build: .
    environment:
      - BasePath=/shush
    volumes:
      - shush-data:/app/.shush
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.shush-design.rule=PathPrefix(`/shush`)
      - traefik.http.routers.shush-design.entrypoints=web
      - traefik.http.services.shush-design.loadbalancer.server.port=8080

networks:
  proxy:
    external: true

volumes:
  shush-data:
